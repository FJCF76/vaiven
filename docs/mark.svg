<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vaivén — a swing, caught at both ends of its arc.">

  <!-- the arc it travels, between the two positions of the seat -->
  <path d="M18.9 39.6 A 30 30 0 0 1 45.1 39.6" fill="none" stroke="#8892a0"
        stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3.4" opacity=".7"/>

  <!-- outbound: where it swung to -->
  <g transform="rotate(26 32 12)" stroke="#c9821e" fill="#c9821e" opacity=".42">
    <path d="M26 13 V 40" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M38 13 V 40" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <rect x="21.5" y="39.5" width="21" height="4.6" rx="2.3" stroke="none"/>
  </g>

  <!-- return: where it is coming back to -->
  <g transform="rotate(-26 32 12)" stroke="#0e8574" fill="#0e8574">
    <path d="M26 13 V 40" stroke-width="2.7" stroke-linecap="round" fill="none"/>
    <path d="M38 13 V 40" stroke-width="2.7" stroke-linecap="round" fill="none"/>
    <rect x="21" y="39.3" width="22" height="5.2" rx="2.6" stroke="none"/>
  </g>

  <!-- the beam it hangs from -->
  <path d="M13 12 H 51" fill="none" stroke="#8892a0" stroke-width="3.2" stroke-linecap="round"/>
</svg>
