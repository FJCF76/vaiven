<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vaivén — a pendulum at both ends of its swing.">
  <!-- the sweep -->
  <path d="M13 45 A 22 22 0 0 1 51 45" fill="none" stroke="#8892a0" stroke-width="1.5"
        stroke-linecap="round" stroke-dasharray="2.5 3.5" opacity=".75"/>

  <!-- outbound: the arm that has swung -->
  <path d="M32 13 L 49 41" fill="none" stroke="#c9821e" stroke-width="3" stroke-linecap="round"
        opacity=".45"/>
  <circle cx="49" cy="41" r="6" fill="#c9821e" opacity=".45"/>

  <!-- return: the arm coming back -->
  <path d="M32 13 L 15 41" fill="none" stroke="#0e8574" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="15" cy="41" r="6.5" fill="#0e8574"/>

  <!-- the pivot -->
  <circle cx="32" cy="13" r="4" fill="none" stroke="#8892a0" stroke-width="2.5"/>
</svg>
